# ─────────────────────────────────────────────────────────────────────────────
# Farmmate (SmartAgri) — Production Redis Configuration
# ─────────────────────────────────────────────────────────────────────────────

# Network & General
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
logfile ""
databases 16
always-show-logo no

# Memory Management & Eviction
# Limit memory to 256MB on VPS; evict least recently used keys automatically
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5
maxmemory-eviction-tenacity 10

# Non-blocking Lazy Freeing (prevents latency spikes when deleting/evicting keys)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

# RDB Snapshots (point-in-time backups)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF Persistence (Append-Only File for data durability across restarts)
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Clients & Limits
maxclients 10000
