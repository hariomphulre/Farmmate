name: GHCR Deployment

on:
  push:
    branches:
      - deploy
      - main

# Set global environment variables
env:
  REGISTRY: ghcr.io
  # GitHub automatically converts the repo owner to lowercase, which Docker requires
  GITHUB_USERNAME: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Allows GitHub Actions to push images to your GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 1. Build Client (Nginx) ---
      - name: Build and push Client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/farmmate-client:latest
          # Add build-args here if your React app needs them during build
          # build-args: |
          #   VITE_API_URL=https://farmmate.hariomphulre.tech/api

      # --- 2. Build Server ---
      - name: Build and push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/farmmate-server:latest

      # --- 3. Build ML Service ---
      - name: Build and push ML Service
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/farmmate-ml-service:latest

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Securely copy the Compose file AND necessary config folders to the VPS
      - name: Copy config files to VPS via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 2222 }}
          timeout: 30s
          command_timeout: 10m
          source: "docker-compose.yml,nginx/,server/.env.example"
          target: "CodingWorkspace/Projects/Farmmate/"

      - name: Pull Images and Restart Containers on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 2222 }}
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            
            # Ensure target directories exist for env files
            mkdir -p CodingWorkspace/Projects/Farmmate/server
            cd CodingWorkspace/Projects/Farmmate
            
            # If production env doesn't exist, create a template from example
            if [ ! -f server/.env.production ] && [ -f server/.env.example ]; then
              cp server/.env.example server/.env.production
              echo "⚠️ Created server/.env.production from example. Please fill in your API keys!"
            fi

            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            
            # Pull latest images
            docker compose pull
            
            # Bring up the containers, removing old orphans, wait for healthchecks
            if docker compose up -d --remove-orphans --wait --wait-timeout 260; then
    
                # Clean up dangling images
                docker image prune -f 
                
                echo "✅ Deployment Successful! Current live containers:"
                docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                
            else
                echo "❌ Deployment Failed or Timed Out! Check container logs."
                exit 1
            fi
