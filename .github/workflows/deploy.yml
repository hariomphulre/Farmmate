deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # --- DIAGNOSTIC STEP ---
      - name: Debug Network Connection to VPS
        run: |
          echo "Resolving host and checking port 22 reachability..."
          nc -zv -w 10 ${{ secrets.VPS_HOST }} 22

      # --- SCP STEP ---
      - name: Copy config files to VPS via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,nginx/,server/.env.example"
          target: "CodingWorkspace/Projects/Farmmate/"

      - name: Pull Images and Restart Containers on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p CodingWorkspace/Projects/Farmmate/server
            cd CodingWorkspace/Projects/Farmmate
            
            if [ ! -f server/.env.production ] && [ -f server/.env.example ]; then
              cp server/.env.example server/.env.production
            fi

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose pull
            
            if docker compose up -d --remove-orphans --wait --wait-timeout 260; then
                docker image prune -f 
                echo "✅ Deployment Successful!"
                docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            else
                echo "❌ Deployment Failed!"
                exit 1
            fi