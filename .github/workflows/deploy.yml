name: GHCR Deployment

on:
  push:
    branches:
      - deploy
      - main

# Set global environment variables
env:
  REGISTRY: ghcr.io
  # GitHub automatically converts the repo owner to lowercase, which Docker requires
  GITHUB_USERNAME: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Allows GitHub Actions to push images to your GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container

      # --- 1. Build Client (Nginx) ---
      - name: Build and push Client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/farmmate-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_GROQ_API_KEY=${{ secrets.VITE_GROQ_API_KEY }}
            VITE_GROQ_API_URL=${{ secrets.VITE_GROQ_API_URL }}
            VITE_DATA_GOV_API_KEY=${{ secrets.VITE_DATA_GOV_API_KEY }}

      # --- 2. Build Server ---
      - name: Build and push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/farmmate-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 3. Build ML Service ---
      - name: Build and push ML Service
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/farmmate-ml-service:latest

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Securely copy the Compose file AND necessary config folders to the VPS
      - name: Copy config files to VPS via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 2222 }}
          timeout: 30s
          command_timeout: 30m
          source: "docker-compose.yml,nginx/"
          target: "CodingWorkspace/Projects/Farmmate/"

      - name: Pull Images and Restart Containers on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 2222 }}
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e
            
            # Ensure target directories exist for env files
            mkdir -p CodingWorkspace/Projects/Farmmate/server
            cd CodingWorkspace/Projects/Farmmate

            if [ ! -f server/.env.production ]; then
              echo "❌ Missing server/.env.production on the VPS. Create it once with real production secrets before deploying."
              exit 1
            fi

            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            
            # Pull latest images
            docker compose pull --quiet
            
            # Bring up the containers, removing old orphans, wait for healthchecks
            if docker compose up -d --remove-orphans --wait --wait-timeout 600; then
                
                echo "✅ Deployment Successful! Current live containers:"
                docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                
            else
                echo "❌ Deployment Failed or Timed Out! Check container logs."
                exit 1
            fi
