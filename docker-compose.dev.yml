# ─────────────────────────────────────────────────────────────────────────────
# Farmmate — Development Docker Compose Override
# Provides hot-reloading for client and server during local development.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────────────────────

name: farmmate

services:

  # Override client with the Vite dev server (hot reload)
  client:
    build:
      context: ./client
      target: builder          # stops after npm ci — runs Vite in dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src:ro
      - ./client/public:/app/public:ro
    environment:
      VITE_API_URL: http://server:5000
    depends_on: []

  # Nginx ingress gateway (optional in dev; developers access Vite on :5173 directly)
  nginx:
    profiles:
      - gateway

  # Local Redis with host port exposed for debugging
  redis:
    ports:
      - "127.0.0.1:6379:6379"

  # Server with nodemon for hot reload
  server:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npx nodemon server.cjs"]
    volumes:
      - ./server:/app
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-farmmate_redis_secure_pass_2026}
    ports:
      - "5000:5000"
    depends_on:
      - redis

  # ML service — disabled for now (uncomment if running ML locally)
  # ml-service:
  #   command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  #   volumes:
  #     - ./ml-service:/app
