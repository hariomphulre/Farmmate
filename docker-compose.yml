# ─────────────────────────────────────────────────────────────────────────────
# Farmmate (SmartAgri) — Production Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   cp .env.example .env.production
#   # fill in real secrets in .env.production
#   docker compose --env-file .env.production up -d --build
# ─────────────────────────────────────────────────────────────────────────────

name: farmmate

services:

  # ── 1. Nginx — reverse proxy + React static files ──────────────────────────
  nginx:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    container_name: farmmate-nginx
    image: ghcr.io/hariomphulre/farmmate-client:latest
    restart: unless-stopped

    ports:
      - "${NGINX_PORT:-8081}:80"

    depends_on:
      server:
        condition: service_healthy

    networks:
      - farmmate-net

    volumes:
      # Serve the Nginx config from the repo
      # (easy to update without rebuild)
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M


  # ── 2. Server — Node/Express REST API ──────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: farmmate-server
    image: ghcr.io/hariomphulre/farmmate-server:latest
    restart: unless-stopped

    env_file:
      - path: ./server/.env.production
        required: false
      - path: ./server/.env.example
        required: false

    environment:
      NODE_ENV: production
      PORT: ${SERVER_PORT:-5000}
      ML_SERVICE_URL: http://ml-service:8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://farmmate.hariomphulre.tech}

    # Optional direct host access for debugging.
    # Keep this on localhost so it is not publicly exposed.
    ports:
      - "127.0.0.1:${SERVER_PORT:-5000}:5000"

    depends_on:
      ml-service:
        condition: service_healthy

    networks:
      - farmmate-net

    volumes:
      # Persist uploaded images and detection results across restarts
      - server-uploads:/app/crop_imgs
      - server-results:/app/detect_results
      - server-fields:/app/Field_co-ordinates
      - server-field-coords:/app/field_corrdinates

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M


  # ── 3. ML Service — FastAPI + YOLO + scikit-learn ──────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
      target: production
    container_name: farmmate-ml
    image: ghcr.io/hariomphulre/farmmate-ml-service:latest
    restart: unless-stopped

    environment:
      APP_BASE_DIR: /app
      CROP_DATA_PATH: /app/crop_prediction/crop_data
      CROP_MODEL_PATH: /app/crop_prediction/crop_recommendation.pkl
      MODELS_DIR: /app/models
      YOLO_MIN_CONF: "0.5"
      YOLO_RESOLUTION: "480x480"

    networks:
      - farmmate-net

    volumes:
      # Share uploaded images so YOLO can read them if needed
      - server-uploads:/app/crop_imgs:ro
      - server-results:/app/detect_results

      # Persist output.json between restarts
      - ml-crop-data:/app/crop_prediction/crop_data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G


  # ── 4. GEE Worker — Google Earth Engine batch jobs ─────────────────────────
  # This is a one-shot job container, not a long-running service.
  #
  # Run manually:
  #   docker compose run --rm gee-worker python jobs.py --job vegetation_data
  #
  # Or schedule via cron / Cloud Scheduler.
  #
  # gee-worker:
  #   build:
  #     context: ./Google_Earth_Engine
  #     dockerfile: Dockerfile
  #     target: production
  #   container_name: farmmate-gee
  #   image: farmmate/gee-worker:latest
  #   restart: "no"
  #   env_file:
  #     - path: ./Google_Earth_Engine/.env.production
  #       required: false
  #     - path: ./Google_Earth_Engine/.env.example
  #       required: false
  #   environment:
  #     JOB_NAME: "${GEE_JOB_NAME:-vegetation_data}"
  #   networks:
  #     - farmmate-net
  #   profiles:
  #     - gee
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "1.0"
  #         memory: 1G


# ─────────────────────────────────────────────────────────────────────────────
# Named volumes — data persists across container restarts
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  server-uploads:
  server-results:
  server-fields:
  server-field-coords:
  ml-crop-data:


# ─────────────────────────────────────────────────────────────────────────────
# Network — all containers communicate over this internal bridge
# ─────────────────────────────────────────────────────────────────────────────
networks:
  farmmate-net:
    driver: bridge

