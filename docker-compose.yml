# ─────────────────────────────────────────────────────────────────────────────
# Farmmate (SmartAgri) — Production Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   cp .env.example .env.production (make sure to combine client/server vars)
#   # fill in real secrets in .env.production
#   docker compose --env-file .env.production up -d --build
# ─────────────────────────────────────────────────────────────────────────────

name: farmmate

services:

  # ── 1. App Nginx — React static files + API proxy ─────────────────────────
  nginx:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-}
        - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY:-}
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:-}
        - VITE_GROQ_API_KEY=${VITE_GROQ_API_KEY:-}
        - VITE_GROQ_API_URL=${VITE_GROQ_API_URL:-}
        - VITE_DATA_GOV_API_KEY=${VITE_DATA_GOV_API_KEY:-}
    container_name: farmmate-nginx
    image: ghcr.io/hariomphulre/farmmate-client:latest
    restart: unless-stopped

    depends_on:
      server:
        condition: service_healthy

    networks:
      - farmmate-net

    ports:
      - "127.0.0.1:8082:80"

    volumes:
      # Serve the Nginx config from the repo
      # (easy to update without rebuild)
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M


  # ── 2. Server — Node/Express REST API ──────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: farmmate-server
    image: ghcr.io/hariomphulre/farmmate-server:latest
    restart: unless-stopped

    env_file:
      - path: ./server/.env.production
        required: true

    environment:
      NODE_ENV: production
      PORT: ${SERVER_PORT:-5000}
      ML_SERVICE_URL: http://ml-service:8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://farmmate.hariomphulre.tech,https://www.farmmate.hariomphulre.tech,http://farmmate.hariomphulre.tech,http://www.farmmate.hariomphulre.tech}

    # depends_on:
    #   ml-service:
    #     condition: service_healthy

    networks:
      - farmmate-net

    volumes:
      # Persist uploaded images and detection results across restarts
      - server-uploads:/app/crop_imgs
      - server-results:/app/detect_results
      - server-fields:/app/Field_co-ordinates
      - server-field-coords:/app/field_corrdinates

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M


  # ── 3. ML Service — FastAPI + YOLO + scikit-learn ──────────────────────────
  # Disabled for now: only deploy client and server on the VPS.
  # ml-service:
  #   build:
  #     context: ./ml-service
  #     dockerfile: Dockerfile
  #     target: production
  #   container_name: farmmate-ml
  #   image: ghcr.io/hariomphulre/farmmate-ml-service:latest
